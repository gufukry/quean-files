name: Build QueAN Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（形如 v1.0.0，决定更新清单里的版本）'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install

      - name: Install Blockbench skin editor dependencies
        run: npm ci
        working-directory: third-party/blockbench

      - name: Apply updater public key
        if: vars.TAURI_UPDATER_PUBKEY != ''
        shell: pwsh
        run: |
          $conf = 'apps/app/tauri-release.conf.json'
          $json = (Get-Content $conf -Raw) -replace '"pubkey"\s*:\s*"[^"]*"', ('"pubkey": "' + '${{ vars.TAURI_UPDATER_PUBKEY }}' + '"')
          [IO.File]::WriteAllText((Resolve-Path $conf), $json)
          Select-String -Path $conf -Pattern pubkey

      - name: Build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { $env:GITHUB_REF_NAME }
          Write-Host "Building $tag"
          node scripts/axolotl/local-release.mjs $tag 2>&1 | Tee-Object -FilePath build-log.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Build failed (exit $code)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value (Get-Content build-log.txt -Tail 200)
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          }
          exit $code

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: quean-release
          path: release/**
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: quean-release
          path: art

      - name: Locate files
        id: loc
        run: |
          if [ -d art/release ]; then echo "dir=art/release" >> "$GITHUB_OUTPUT"; else echo "dir=art" >> "$GITHUB_OUTPUT"; fi
          ls -laR art | head -60

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload to update server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          HOST: "${{ vars.SERVER_HOST || '103.242.2.127' }}"
          SSHDEST: "${{ vars.SERVER_UPDATE_DIR || '/www/wwwroot/qafaka.cc.cd/quean-update' }}"
        run: |
          set -e
          SRC="${{ steps.loc.outputs.dir }}"
          sshpass -e scp -o StrictHostKeyChecking=no -r "$SRC"/. "root@$HOST:$SSHDEST/"
          sshpass -e ssh -o StrictHostKeyChecking=no "root@$HOST" "chown -R www:www $SSHDEST && find $SSHDEST -type f -exec chmod 644 {} + && echo '--- $SSHDEST ---' && ls -la $SSHDEST"
